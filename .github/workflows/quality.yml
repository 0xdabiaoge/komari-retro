name: Quality checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  workflow-lint:
    name: 检查 GitHub Actions 工作流
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 测试自动版本递增规则
        run: python3 .github/scripts/test_next_release_version.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: 校验工作流语法与表达式
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', 'komari-agent']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - run: go test ./... && go vet ./...
        working-directory: '${{ matrix.module }}'
      - run: bash -n install-komari.sh && bash script/install-regression.sh
        if: matrix.module == '.'
      - run: go test -race ./...
        working-directory: '${{ matrix.module }}'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: '${{ matrix.module }}'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            komari-web/package-lock.json
            komari-next/package-lock.json
      - run: npm ci && npm audit --audit-level=low && npm test && npm run lint && npm run build
        working-directory: komari-web
      - name: Build and audit the Komari Retro theme
        run: npm ci && npm audit --audit-level=high && npm run lint && npm run build
        working-directory: komari-next
      - run: npx playwright install --with-deps chromium
        working-directory: komari-web
      - run: |
          npm run dev -- --host 127.0.0.1 > /tmp/komari-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/komari-vite.log; exit 1; fi
            sleep 1
          done
          npm run test:onboarding
        working-directory: komari-web
