name: Quality checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  workflow-lint:
    name: 检查 GitHub Actions 工作流
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 测试自动版本递增规则
        run: python3 .github/scripts/test_next_release_version.py
      - name: 校验工作流语法与表达式
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 .github/workflows/*.yml

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'komari-agent']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - run: go test ./... && go vet ./...
        working-directory: '${{ matrix.module }}'
      - run: bash -n install-komari.sh && bash script/install-regression.sh
        if: matrix.module == '.'
      - run: python3 script/agent-install-linux.test.py
        if: matrix.module == '.'
      - name: 检查安全验收脚本并模糊测试 RPC 解析器
        if: matrix.module == '.'
        run: |
          python3 -m py_compile script/security-acceptance.py
          go test ./pkg/rpc -run='^$' -fuzz=FuzzParseRequests -fuzztime=10s -parallel=2
      - run: go test -race ./...
        working-directory: '${{ matrix.module }}'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: '${{ matrix.module }}'
  agent-windows:
    name: Windows Agent 原生测试
    runs-on: windows-latest
    defaults:
      run:
        working-directory: komari-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: komari-agent/go.sum
      - run: go test ./...
      - run: go vet ./...

      - name: 验证 Agent 安装失败保留旧服务
        run: python ../script/agent-install-windows.test.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            komari-web/package-lock.json
            komari-next/package-lock.json
      - run: npm ci && npm audit --audit-level=low && npm test && npm run lint && npm run build && npm run build:guest
        working-directory: komari-web
      - name: Build and audit the Komari Retro theme
        run: npm ci && npm audit --audit-level=high && npm run lint && npm run build && npm run build:guest
        working-directory: komari-next
      - name: 验证编译产物与游客资源隔离
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: 验证游客与管理资源隔离
        run: |
          node script/embed-frontends.mjs
          go test ./web/public ./web/api ./web/rpc/jsonrpc
      - run: npx playwright install --with-deps chromium
        working-directory: komari-web
      - name: 实际浏览器验收游客与管理员资源
        run: |
          go build -o /tmp/komari-audience .
          python3 script/private-audience-fixture.py /tmp/komari-audience
      - run: |
          npm run dev -- --host 127.0.0.1 > /tmp/komari-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/komari-vite.log; exit 1; fi
            sleep 1
          done
          npm run test:onboarding
        working-directory: komari-web
