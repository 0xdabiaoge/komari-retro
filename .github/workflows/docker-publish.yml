name: 手动构建并推送 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '镜像版本标签 (例如 latest 或 v1.2.5)'
        required: true
        default: 'latest'
      push_latest:
        description: '是否同时打上 latest 标签'
        type: boolean
        required: true
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    name: 构建前端静态资源 (build-frontend)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 编译前端资产
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd komari-web
          npm install
          npm run build
          cd ..
          mkdir -p web/public/defaultTheme/dist
          rm -rf web/public/defaultTheme/dist/*
          cp -r komari-web/dist/* web/public/defaultTheme/dist/
          cp -f komari-web/komari-theme.json web/public/defaultTheme/
          if [ -f komari-web/preview.png ]; then cp -f komari-web/preview.png web/public/defaultTheme/; fi
          if [ -f komari-web/perview.png ]; then cp -f komari-web/perview.png web/public/defaultTheme/; fi
          if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
          if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: web/public/defaultTheme/

  build-and-push-docker:
    name: 交叉编译多架构并推送 Docker 镜像
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: web/public/defaultTheme/

      - name: 配置 Go 运行环境
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 安装 Zig 交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl
          wget https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          sudo tar -C /usr/local -Jxf zig-x86_64-linux-0.14.1.tar.xz
          echo "PATH=$PATH:/usr/local/zig-x86_64-linux-0.14.1" >> $GITHUB_ENV

      - name: 交叉编译 Linux 多架构静态二进制 (amd64 / arm64)
        env:
          GOOS: linux
          CGO_ENABLED: 1
          GIN_MODE: release
        run: |
          VERSION="${{ inputs.tag_name }}"
          VERSION_HASH="${{ github.sha }}"
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"

          echo "Compiling static binary for linux/amd64..."
          GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o komari-linux-amd64

          echo "Compiling static binary for linux/arm64..."
          GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o komari-linux-arm64

      - name: 配置 QEMU 模拟器
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算 Docker 镜像标签
        id: docker_tags
        run: |
          TAG_INPUT="${{ inputs.tag_name }}"
          BASE_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${BASE_IMG}:${TAG_INPUT}"
          if [ "${{ inputs.push_latest }}" = "true" ] && [ "$TAG_INPUT" != "latest" ]; then
            TAGS="${TAGS},${BASE_IMG}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: 构建并推送多架构 Docker 镜像 (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_tags.outputs.tags }}
