name: 手动发布 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '已发布的 Release 标签，latest 自动解析为最新 Release'
        required: true
        default: latest
      push_latest:
        description: '同时更新 latest 镜像标签'
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载并校验同版本 Release 二进制
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_TAG" = latest ]; then
            TAG=$(gh release view --json tagName --jq .tagName)
          else
            TAG="$REQUESTED_TAG"
          fi
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          # Only use binaries built from this checkout. Fail closed on stale/mismatched releases.
          RELEASE_COMMIT=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          [ "$RELEASE_COMMIT" = "$GITHUB_SHA" ] || { echo 'Select the workflow ref matching the Release tag'; exit 1; }
          for ARCH in amd64 arm64; do
            FILE="komari-linux-$ARCH"
            gh release download "$TAG" --pattern "$FILE" --pattern "$FILE.sha256"
            EXPECTED=$(awk 'NR==1 {print $1}' "$FILE.sha256")
            [[ "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
            ACTUAL=$(sha256sum "$FILE" | awk '{print $1}')
            [ "${EXPECTED,,}" = "$ACTUAL" ] || exit 1
            chmod 0755 "$FILE"
          done
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像标签
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          IMAGE="${IMAGE,,}"
          TAGS="$IMAGE:$RELEASE_TAG"
          if [ "$PUSH_LATEST" = true ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
