services:
  komari:
    build:
      context: .
      dockerfile: Dockerfile
    image: komari-retro:latest
    container_name: komari-docker
    restart: always
    ports:
      - "25775:25774"
    volumes:
      - ./data:/app/data
    environment:
      - GIN_MODE=release
      - KOMARI_DB_TYPE=sqlite
      - KOMARI_DB_FILE=/app/data/komari.db
      - KOMARI_LISTEN=0.0.0.0:25774
