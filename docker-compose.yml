services:
  komari:
    image: ghcr.io/0xdabiaoge/komari-retro:latest
    container_name: komari-docker
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "--max-time", "3", "http://127.0.0.1:25774/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "25775:25774"
    volumes:
      - ./docker-data:/app/data
    environment:
      - GIN_MODE=release
      - KOMARI_DB_TYPE=sqlite
      - KOMARI_DB_FILE=/app/data/komari.db
      - KOMARI_LISTEN=0.0.0.0:25774
